[workspace]
resolver = "2"
members = ["core", "mmap", "registry", "search", "ntfs", "creds", "analysis", "cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
stratum-mmap = { path = "mmap" }
stratum-registry = { path = "registry" }
stratum-core = { path = "core" }
memmap2 = "0.9.11"
sha2 = "0.11.0"
blake3 = "1.8.7"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
crc32fast = "1.5.2"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
