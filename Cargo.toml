[workspace]
resolver = "2"
# stratum_backend: Analyse-Engine und CLI; stratum_model: gemeinsames
# Datenmodell. Weitere Teile (stratum_frontend, ...) kommen daneben.
members = [
    "stratum_backend/core",
    "stratum_backend/mmap",
    "stratum_backend/registry",
    "stratum_backend/ese",
    "stratum_backend/vss",
    "stratum_backend/ewf",
    "stratum_backend/search",
    "stratum_backend/ntfs",
    "stratum_backend/creds",
    "stratum_backend/analysis",
    "stratum_backend/normalize",
    "stratum_backend/store",
    "stratum_backend/lauf",
    "stratum_backend/jobs",
    "stratum_backend/connectors",
    "stratum_backend/server",
    "stratum_backend/cli",
    "stratum_model",
]
exclude = ["stratum_backend/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
stratum-mmap = { path = "stratum_backend/mmap" }
stratum-registry = { path = "stratum_backend/registry" }
stratum-ese = { path = "stratum_backend/ese" }
stratum-vss = { path = "stratum_backend/vss" }
stratum-ewf = { path = "stratum_backend/ewf" }
stratum-core = { path = "stratum_backend/core" }
memmap2 = "0.9.11"
sha2 = "0.11.0"
blake3 = "1.8.7"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
crc32fast = "1.5.2"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
