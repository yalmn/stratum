# Begriffstabelle "Strafverfolgung" fuer stratum.
#
# Diese Liste ist die mitgelieferte Voreinstellung: sie ist in das Programm
# eingebaut und laeuft, sofern nicht mit --no-default-keywords abgeschaltet,
# bei jeder Analyse mit. Diese Datei dient zusaetzlich als lesbare Vorlage.
#
# Sie ist ein neutraler Ausgangspunkt zu haeufigen Deliktsfeldern, kein fertiger
# Fallkatalog: pruefe pro Fall, welche Kategorien sinnvoll sind, schalte
# Unpassendes ab (aktiv = false) und ergaenze eigene Begriffe in einer zweiten
# Tabelle (siehe eigene.toml). Name und Version stehen im Report, damit
# nachvollziehbar bleibt, wonach gesucht wurde.
#
# Aufruf mit eigener Zusatzliste:
#   stratum merged.dd -o report.json -k eigene.toml

[meta]
name = "Strafverfolgung"
version = 2
max_treffer = 200000

# Zugangsdaten im Klartext: nur als Paar aus einem Benutzer- und einem
# Passwort-Feld in geringem Abstand. Das senkt die Fehltrefferzahl stark.
[[kategorie]]
id = "zugangsdaten"
aktiv = true
modus = "paar"
abstand_bytes = 128
links = ["user", "username", "benutzer", "benutzername", "login", "anmeldename", "konto", "account", "uname", "usern", "mail", "email", "e-mail", "nick"]
rechts = ["pw", "pwd", "pass", "passw", "passwort", "password", "pword", "kennwort", "secret", "geheim", "code", "token", "apikey", "api_key"]

# Hinweise auf einen versteckten Dienst im Tor-Netz oder Darknet-Handel.
[[kategorie]]
id = "darknet"
aktiv = true
onion_pruefung = true
begriffe = [".onion", "torrc", "HiddenServiceDir", "hs_ed25519_secret_key", "hs_ed25519_public_key", "tor browser", "torproject", "hidden service", "onion service", "i2p", "eepsite", "dread", "escrow", "vendor", "marketplace", "dark market", "pgp key"]

# Anonymisierung und Verschluesselung, oft zur Verschleierung genutzt.
[[kategorie]]
id = "anonymisierung"
aktiv = true
begriffe = ["vpn", "openvpn", "wireguard", "nordvpn", "protonvpn", "mullvad", "proxychains", "tails", "whonix", "qubes", "veracrypt", "truecrypt", "bitlocker", "cryptomator", "keepass", "bitwarden", "gpg", "pgp", "gnupg", "shredder", "ccleaner", "eraser"]

# Kryptowaehrungen und Wallets.
[[kategorie]]
id = "kryptowaehrung"
aktiv = true
begriffe = ["bitcoin", "btc", "wallet.dat", "electrum", "monero", "xmr", "ethereum", "litecoin", "seed phrase", "mnemonic", "recovery phrase", "private key", "blockchain", "exodus", "metamask", "ledger", "trezor", "coinbase", "binance", "kraken", "mixer", "tumbler", "cashout"]

# Finanz-, Vermoegens- und Betrugsdelikte.
[[kategorie]]
id = "finanzbetrug"
aktiv = true
begriffe = ["betrug", "phishing", "fake", "faelschung", "geldwaesche", "money laundering", "carding", "dump", "fullz", "cvv", "track2", "skimming", "iban", "kreditkarte", "credit card", "paypal", "klarna", "western union", "moneygram", "ueberweisung", "rechnung", "mahnung", "strohmann", "mule", "drop"]

# Ausweis- und Identitaetsdokumente.
[[kategorie]]
id = "dokumente"
aktiv = true
begriffe = ["personalausweis", "reisepass", "fuehrerschein", "ausweis", "passport", "id card", "geburtsurkunde", "meldebescheinigung", "aufenthaltstitel", "visum", "gefaelscht", "faelschung", "blanko", "template", "vorlage", "hologramm"]

# Cybercrime, Schadsoftware und Angriffswerkzeuge.
[[kategorie]]
id = "cybercrime"
aktiv = true
begriffe = ["malware", "ransomware", "trojaner", "keylogger", "spyware", "stealer", "rat", "botnet", "command and control", "exploit", "payload", "backdoor", "mimikatz", "cobalt strike", "metasploit", "shellcode", "bruteforce", "hydra", "credential", "exfil", "dropper", "loader", "obfuscated"]

# Betaeubungsmittel. Kann bei allgemeinen Texten rauschen, bei Bedarf abschalten.
[[kategorie]]
id = "betaeubungsmittel"
aktiv = true
begriffe = ["kokain", "koks", "heroin", "amphetamin", "speed", "methamphetamin", "crystal", "cannabis", "marihuana", "haschisch", "gras", "weed", "mdma", "ecstasy", "pille", "lsd", "ketamin", "fentanyl", "gramm", "streckmittel", "dealer", "bunker", "grow"]

# Waffen und Sprengstoff.
[[kategorie]]
id = "waffen"
aktiv = true
begriffe = ["waffe", "pistole", "schusswaffe", "revolver", "gewehr", "munition", "patronen", "kaliber", "schalldaempfer", "sprengstoff", "sprengsatz", "tnt", "detonator", "zuender", "glock", "kalaschnikow", "ak47", "3d druck", "ghost gun"]

# Verbreitete Messenger, in Chats oft Ausgangspunkt fuer weitere Spuren.
# Standardmaessig aus, da haeufig und damit rauschanfaellig.
[[kategorie]]
id = "kommunikation"
aktiv = false
begriffe = ["telegram", "signal", "threema", "wickr", "whatsapp", "wire", "session", "jabber", "xmpp", "briar", "element", "matrix"]

# Darstellungen sexuellen Kindesmissbrauchs.
#
# Diese Begriffe werden bewusst NICHT mitgeliefert. Solche Wortlisten sind bei
# den Fachdienststellen hinterlegt und gehoeren aus gutem Grund nicht in ein
# oeffentliches Repository. Fuege sie im Fall in einer separaten, nicht
# veroeffentlichten Tabelle ein und schalte diese Kategorie dort frei.
[[kategorie]]
id = "missbrauchsdarstellung"
aktiv = false
begriffe = []
