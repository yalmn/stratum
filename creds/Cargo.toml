[package]
name = "stratum-creds"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Extraktion lokaler Windows-Konten (Benutzername + NT-Hash) aus SAM und SYSTEM fuer stratum"

[dependencies]
stratum-registry.workspace = true
thiserror.workspace = true
serde = { workspace = true }
md-5 = "0.11.0"
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["block-padding"] }
des = "0.9.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
hmac = "0.13.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
aes-gcm = "0.11.1"

[dev-dependencies]
serde_json = "1.0.151"
