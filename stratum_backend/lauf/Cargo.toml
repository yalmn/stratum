[package]
name = "stratum-lauf"
description = "Analyselauf von stratum als Bibliothek: Image bis Report, Datenmodell und Datenbank"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stratum-core.workspace = true
stratum-ntfs = { path = "../ntfs" }
stratum-search = { path = "../search" }
stratum-creds = { path = "../creds" }
stratum-analysis = { path = "../analysis" }
stratum-ewf.workspace = true
stratum-normalize = { path = "../normalize" }
stratum-store = { path = "../store" }
stratum-model = { path = "../../stratum_model" }
uuid = "1.26.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "now"] }
serde = { workspace = true }
serde_json = "1.0.151"
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["rt"] }

[dev-dependencies]
tempfile.workspace = true
