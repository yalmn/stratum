[package]
name = "stratum-jobs"
description = "Worker für Jobs von stratum: holt Aufträge aus PostgreSQL und führt sie aus"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stratum-connectors = { path = "../connectors" }
tempfile.workspace = true
stratum-core.workspace = true
stratum-lauf = { path = "../lauf" }
stratum-store = { path = "../store" }
stratum-model = { path = "../../stratum_model" }
serde = { workspace = true }
serde_json = "1.0.151"
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["rt"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "now"] }

[dev-dependencies]
tempfile.workspace = true
stratum-core.workspace = true
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread"] }
uuid = "1.26.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
