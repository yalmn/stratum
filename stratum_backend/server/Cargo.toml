[package]
name = "stratum-server"
description = "HTTP-API von stratum (/api/v1) auf Axum"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stratum-connectors = { path = "../connectors" }
stratum-core.workspace = true
stratum-store = { path = "../store" }
stratum-jobs = { path = "../jobs" }
stratum-lauf = { path = "../lauf" }
tower-http = { version = "0.7.1", features = ["fs"] }
stratum-model = { path = "../../stratum_model" }
axum = "0.8.9"
base64ct = { version = "1.8.3", features = ["alloc"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net", "time", "sync"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = "1.0.151"
thiserror.workspace = true
uuid = "1.26.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "now"] }

[dev-dependencies]
stratum-analysis = { path = "../analysis" }
stratum-normalize = { path = "../normalize" }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await-macro"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net", "time", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tempfile.workspace = true
stratum-core.workspace = true
