[package]
name = "stratum-store"
description = "Speichert das Datenmodell von stratum in PostgreSQL"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stratum-model = { path = "../../stratum_model" }
stratum-normalize = { path = "../normalize" }
stratum-core.workspace = true
argon2 = "0.6.0"
getrandom = "0.4.3"
sha2.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
serde_json = "1.0.151"
thiserror.workspace = true
serde.workspace = true
uuid = "1.26.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
stratum-analysis = { path = "../analysis" }
tokio = { version = "1.53.1", features = ["rt", "macros"] }
